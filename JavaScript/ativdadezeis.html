<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <input type="text" id="campoInput" placeholder="Digite aqui...">
<p>Você digitou: <span id="textoTempoReal"></span></p>

<script>
  const campo = document.getElementById('campoInput');
  const saida = document.getElementById('textoTempoReal');

  campo.addEventListener('input', function(e) {
    saida.textContent = e.target.value;
  });
</script>
</body>
</html>
