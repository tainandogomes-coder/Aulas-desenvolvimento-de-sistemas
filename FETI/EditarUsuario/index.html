<body>
    <main class="centro">
        <div>
        <h1>Atualizar  Tarefa</h1>
        <form onsubmit="atualizarTarefa(event)">
            <div class="mb-3">
                <label for="nomeTarefa" class="form-label">Nome da Tarefa</label>
                <input type="text" class="form-control" id="nomeTarefa" required>
            </div>
            <div class="mb-3">
                <label for="descricaoTarefa" class="form-label">Descrição da Tarefa</label>
                <input type="number" class="form-control" id="descricaoTarefa" min="0" max="150" required>
            </div>
            <button type="submit" class="btn btn-primary">Atualizar</button>
        </form>
        </div>
    </main>
